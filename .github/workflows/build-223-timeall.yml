name: Build 223 Time All

"on":
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 基线 dd4f4dd：这是 MessageBubbles.kt 被删除之前的最后一个完整提交
      # 之后的 c675e4cf 删掉了 MessageBubbles.kt 但 ChatMessage.kt 仍引用它
      # 所以从 c675e4cf 起（含 77f389dc）全部编译不过
      - name: Checkout dd4f4dd full source
        uses: actions/checkout@v4
        with:
          ref: dd4f4dda90588cde27bfdeeb0680fdcfd610c205
          fetch-depth: 0

      - name: Verify base
        run: |
          echo "HEAD=$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "dd4f4dda90588cde27bfdeeb0680fdcfd610c205" && echo "base OK" || exit 1
          echo "--- MessageBubbles.kt 存在性 ---"
          test -f app/src/main/java/me/rerere/rikkahub/ui/components/message/MessageBubbles.kt && echo "MessageBubbles.kt OK" || exit 1

      - name: Checkout patch script
        run: |
          git fetch origin master --depth 1
          git show origin/master:scripts/patch_timeall.py > /tmp/patch_timeall.py

      - name: Apply time patch
        run: |
          python3 /tmp/patch_timeall.py
          echo "----- diff stat -----"
          git --no-pager diff --stat
          echo "----- changed files -----"
          git --no-pager diff --name-only
          echo "----- guard -----"
          ALLOWED="TimeReminderTransformer.kt|GenerationHandler.kt|ProactiveMessageService.kt"
          BAD=$(git --no-pager diff --name-only | grep -vE "$ALLOWED" || true)
          if [ -n "$BAD" ]; then echo "UNEXPECTED FILES CHANGED:"; echo "$BAD"; exit 1; fi
          echo "guard OK - 头像气泡键盘均未改动"
          echo "----- verify -----"
          grep -n "%04d年%02d月%02d日" app/src/main/java/me/rerere/rikkahub/data/ai/transformers/TimeReminderTransformer.kt
          grep -n "buildReminderForProactive" app/src/main/java/me/rerere/rikkahub/data/service/ProactiveMessageService.kt
          grep -n "无条件注入" app/src/main/java/me/rerere/rikkahub/data/ai/GenerationHandler.kt

      - name: Init submodules
        run: git submodule update --init --depth 1 material3/material-color-utilities || true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: pnpm
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate
          if [ -f web-ui/pnpm-lock.yaml ]; then pnpm --dir web-ui install --frozen-lockfile
          elif [ -f web-ui/package.json ]; then pnpm --dir web-ui install
          else echo skip; fi

      - name: keystore
        run: |
          keytool -genkeypair -v -keystore app/release.keystore -storepass orangechat2026 -keypass orangechat2026 -alias orangechat -keyalg RSA -keysize 2048 -validity 36500 -dname "CN=OrangeChat,O=OrangeChat,C=CN"
          printf 'storeFile=release.keystore\nstorePassword=orangechat2026\nkeyAlias=orangechat\nkeyPassword=orangechat2026\n' > local.properties

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-dd4f4dd-timeall-${{ hashFiles('**/*.gradle*') }}

      - name: Build
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleRelease 2>&1 | tee build.log

      - name: Dump failure
        if: failure()
        run: |
          grep -E "^e: " build.log | head -60 || true
          tail -n 80 build.log || true

      - name: Upload artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: orangechat-timeall
          path: app/build/outputs/apk/release/*.apk

      - name: Publish
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          TAG="timeall-$(date +%Y%m%d%H%M)"
          gh release create "$TAG" --repo "$REPO" --title "完整源码 + 全量时间注入" --notes "基于 dd4f4dd 完整源码。时间注入每条消息都有：正常聊天、主动消息、设备事件。格式为年月日时分中文可读，并带距上一条消息间隔。头像、气泡、键盘一个字符未改。" app/build/outputs/apk/release/*.apk
