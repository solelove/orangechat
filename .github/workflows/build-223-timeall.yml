name: Build 223 Time All

"on":
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 77f389dc avatar base
        uses: actions/checkout@v4
        with:
          ref: 77f389dce52d53ddacce4f07ca885a2e3bcbf005
          fetch-depth: 0

      - name: Verify base
        run: |
          echo "HEAD=$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "77f389dce52d53ddacce4f07ca885a2e3bcbf005" && echo "base OK" || exit 1

      - name: Checkout patch script
        run: |
          git fetch origin master --depth 1
          git show origin/master:scripts/patch_timeall.py > /tmp/patch_timeall.py

      - name: Apply time patch
        run: |
          python3 /tmp/patch_timeall.py
          echo "----- diff stat -----"
          git --no-pager diff --stat
          echo "----- avatar untouched check -----"
          git --no-pager diff --name-only | grep -E "Avatar|Bubble|ChatMessage|ImeAuto" && { echo "WARNING avatar touched"; exit 1; } || echo "avatar untouched OK"
          echo "----- verify format -----"
          grep -n "%04d年%02d月%02d日" app/src/main/java/me/rerere/rikkahub/data/ai/transformers/TimeReminderTransformer.kt
          grep -n "buildReminderForProactive" app/src/main/java/me/rerere/rikkahub/data/service/ProactiveMessageService.kt

      - name: Init submodules
        run: git submodule update --init --depth 1 material3/material-color-utilities || true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: pnpm
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate
          if [ -f web-ui/pnpm-lock.yaml ]; then pnpm --dir web-ui install --frozen-lockfile
          elif [ -f web-ui/package.json ]; then pnpm --dir web-ui install
          else echo skip; fi

      - name: keystore
        run: |
          keytool -genkeypair -v -keystore app/release.keystore -storepass orangechat2026 -keypass orangechat2026 -alias orangechat -keyalg RSA -keysize 2048 -validity 36500 -dname "CN=OrangeChat,O=OrangeChat,C=CN"
          printf 'storeFile=release.keystore\nstorePassword=orangechat2026\nkeyAlias=orangechat\nkeyPassword=orangechat2026\n' > local.properties

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-timeall-avatar-${{ hashFiles('**/*.gradle*') }}

      - name: Build
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleRelease 2>&1 | tee build.log

      - name: Dump failure
        if: failure()
        run: |
          grep -E "^e: " build.log | head -60 || true
          tail -n 80 build.log || true

      - name: Upload artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: orangechat-timeall-avatar
          path: app/build/outputs/apk/release/*.apk

      - name: Publish
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          TAG="timeall-avatar-$(date +%Y%m%d%H%M)"
          gh release create "$TAG" --repo "$REPO" --title "223头像版+全量时间注入" --notes "基于 77f389dc。时间注入每条消息都有：正常聊天、主动消息、设备事件。格式为年月日时分中文可读，并带距上一条消息间隔。头像 键盘 气泡 一个字符未动。" app/build/outputs/apk/release/*.apk
