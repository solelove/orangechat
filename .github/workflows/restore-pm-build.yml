name: restore-pm-and-build

on:
  push:
    branches:
      - timefix-202611101010
    paths:
      - 'run-now.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: timefix-202611101010
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify source state
        run: |
          echo "=== PM 大小 ==="
          wc -c app/src/main/java/me/rerere/rikkahub/data/service/ProactiveMessageService.kt
          grep -c "buildReminderForProactive" app/src/main/java/me/rerere/rikkahub/data/service/ProactiveMessageService.kt
          echo "=== TR 时间格式 ==="
          grep -n "年%02d月" app/src/main/java/me/rerere/rikkahub/data/ai/transformers/TimeReminderTransformer.kt
          echo "=== AV 签名 ==="
          grep -n "showUserAvatar: Boolean = true\|fun resolveSplitMode" app/src/main/java/me/rerere/rikkahub/ui/components/message/AvatarVisibility.kt

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        run: |
          npm install -g pnpm@9
          pnpm --version

      - uses: gradle/actions/setup-gradle@v3

      - run: chmod +x ./gradlew

      - name: Build APK
        run: ./gradlew :app:assembleDebug --no-daemon -Dorg.gradle.jvmargs=-Xmx4g --stacktrace

      - name: List APK
        if: always()
        run: find app/build/outputs -name "*.apk" -exec ls -lh {} \; || echo "no apk"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orangechat-timefix
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
