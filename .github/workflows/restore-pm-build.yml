name: restore-pm-and-build

on:
  push:
    branches:
      - timefix-202611101010
    paths:
      - 'run-now.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: timefix-202611101010
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          submodules: false

      - name: Init material-color-utilities submodule
        run: |
          git submodule sync -- material3/material-color-utilities
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule update --init --depth 1 -- material3/material-color-utilities
          echo "=== 子模块内容 ==="
          ls material3/material-color-utilities
          ls material3/material-color-utilities/kotlin | head -20

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'

      - name: Apply source fix (PartRow + shouldHideSideAvatar)
        run: |
          python3 .ci/fix_partrow.py

      - name: Verify source state
        run: |
          echo "=== PM 大小 ==="
          wc -c app/src/main/java/me/rerere/rikkahub/data/service/ProactiveMessageService.kt
          grep -c "buildReminderForProactive" app/src/main/java/me/rerere/rikkahub/data/service/ProactiveMessageService.kt
          echo "=== TR 时间格式 ==="
          grep -n "年%02d月" app/src/main/java/me/rerere/rikkahub/data/ai/transformers/TimeReminderTransformer.kt
          echo "=== PartRow 是否已定义 ==="
          grep -n "fun PartRow(" app/src/main/java/me/rerere/rikkahub/ui/components/message/BubbleSurface.kt
          echo "=== 调用处 ==="
          grep -n "shouldHideSideAvatar(" app/src/main/java/me/rerere/rikkahub/ui/components/message/ChatMessage.kt

      - name: Generate debug keystore
        run: |
          if [ ! -f app/debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore app/debug.keystore \
              -storepass android -keypass android \
              -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          ls -l app/debug.keystore

      - name: Commit fix
        run: |
          git config user.name "solelove"
          git config user.email "19372340679@163.com"
          git add app/src/main/java/me/rerere/rikkahub/ui/components/message/BubbleSurface.kt \
                  app/src/main/java/me/rerere/rikkahub/ui/components/message/ChatMessage.kt
          git commit -m "fix: 补 PartRow 定义 修 shouldHideSideAvatar 命名参数" || echo "nothing"
          git push origin HEAD:timefix-202611101010 || echo "push skipped"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install web-ui deps
        working-directory: web-ui
        run: |
          pnpm install --no-frozen-lockfile
          pnpm --version
          node --version

      - name: Verify web build works
        working-directory: web-ui
        run: pnpm run build

      - uses: gradle/actions/setup-gradle@v3

      - run: chmod +x ./gradlew

      - name: Build APK
        run: ./gradlew :app:assembleDebug --no-daemon -Dorg.gradle.jvmargs=-Xmx4g

      - name: List APK
        if: always()
        run: find app/build/outputs -name "*.apk" -exec ls -lh {} \; || echo "no apk"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orangechat-timefix
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
