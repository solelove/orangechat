name: Publish Memory APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.trigger-memory-build'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Init needed submodules
        run: |
          git submodule update --init --depth 1 material3/material-color-utilities || true

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Create debug keystore
        run: |
          keytool -genkeypair -v \
            -keystore app/debug.keystore \
            -storepass android -keypass android \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug -x :web:buildWebUi --stacktrace

      - name: List APKs
        run: |
          find app/build/outputs/apk -name "*.apk" -exec ls -lh {} \;

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="memory-$(date +%Y%m%d%H%M%S)"
          APK=$(find app/build/outputs/apk -name "*arm64*.apk" | head -1)
          if [ -z "$APK" ]; then APK=$(find app/build/outputs/apk -name "*.apk" | head -1); fi
          echo "publishing $APK as $TAG"
          gh release create "$TAG" \
            --title "记忆库候选区 $TAG" \
            --notes "记忆库页面新增候选记忆区，可查看和决定插件产出的候选记忆" \
            "$APK"
