name: Publish Memory APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.trigger-memory-build'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Init needed submodules
        run: |
          git submodule update --init --depth 1 material3/material-color-utilities || true

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Create debug keystore
        run: |
          keytool -genkeypair -v \
            -keystore app/debug.keystore \
            -storepass android -keypass android \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Build debug
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug -x :web:buildWebUi --stacktrace

      - name: List APKs
        run: |
          echo "=== all apks ==="
          find app/build/outputs -name "*.apk" -exec ls -lh {} \;

      - name: Prepare apk (arm64 preferred)
        run: |
          set -e
          echo "--- pick arm64 ---"
          APK=$(find app/build/outputs -name "*arm64*.apk" | head -1)
          if [ -z "$APK" ]; then
            echo "no arm64, try universal"
            APK=$(find app/build/outputs -name "*universal*.apk" | head -1)
          fi
          if [ -z "$APK" ]; then
            echo "no universal, exclude x86"
            APK=$(find app/build/outputs -name "*.apk" ! -name "*x86*" | head -1)
          fi
          if [ -z "$APK" ]; then echo "NO APK AT ALL"; exit 1; fi
          echo "CHOSEN=$APK"
          cp "$APK" app/build/outputs/orangechat-memory.apk
          ls -lh app/build/outputs/orangechat-memory.apk

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: memory-${{ github.run_number }}-${{ github.run_attempt }}
          name: 记忆库候选区 #${{ github.run_number }}
          body: 记忆库页面新增候选记忆区
          files: app/build/outputs/orangechat-memory.apk
          draft: false
          prerelease: false
