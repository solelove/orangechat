name: Build Debug APK

on:
  workflow_dispatch:
  push:
    branches: [ master ]

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Gradle Build (debug)
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleDebug --stacktrace 2>&1 | tee build.log

      - name: Dump failure log to repo
        if: failure()
        run: |
          {
            echo "run=${{ github.run_id }} sha=${{ github.sha }}"
            echo "=== kotlin errors ==="
            grep -E "^e: " build.log | head -120 || true
            echo "=== what went wrong ==="
            sed -n '/What went wrong/,/BUILD FAILED/p' build.log | head -120 || true
            echo "=== tail ==="
            tail -n 200 build.log || true
          } > ci-last-error.log
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add -f ci-last-error.log
          git commit -m "ci: dump build error [skip ci]" || true
          git push origin HEAD:master || true

      - name: Extract version
        if: success()
        id: version
        run: |
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: orangechat-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Publish release
        if: success()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="debug-${{ steps.version.outputs.version }}-$(date +%Y%m%d%H%M)"
          gh release create "$TAG" \
            --title "Debug $TAG" \
            --notes "shizuku-shell build" \
            app/build/outputs/apk/debug/*.apk
