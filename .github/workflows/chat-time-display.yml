name: chat-time-display
on:
  push:
    branches: [master]
jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: patch prefs
        run: |
          python3 - <<'PY'
import io
p='app/src/main/java/me/rerere/rikkahub/data/datastore/PreferencesStore.kt'
s=io.open(p,encoding='utf-8').read()
old='''    val bubbleImageOverlayEnabled: Boolean = false, // 关=纯图片, 开=图片+主题色遮罩
)'''
new='''    val bubbleImageOverlayEnabled: Boolean = false, // 关=纯图片, 开=图片+主题色遮罩
    // 消息时间显示：气泡左上角小字（常驻） / 居中时间条（可隐藏为透明）
    val showMessageTimeLabel: Boolean = true,
    val showChatTimeHeader: Boolean = false,
)'''
assert old in s, 'prefs miss'
s=s.replace(old,new)
io.open(p,'w',encoding='utf-8').write(s)
print('prefs ok')
PY
      - name: patch chatlist
        run: |
          python3 - <<'PY'
import io
p='app/src/main/java/me/rerere/rikkahub/ui/pages/chat/ChatList.kt'
s=io.open(p,encoding='utf-8').read()

old='''                    if (timeHeader != null) {
                        ChatTimeHeader(text = timeHeader)
                    }'''
new='''                    if (timeHeader != null) {
                        ChatTimeHeader(
                            text = timeHeader,
                            alpha = if (settings.displaySetting.showChatTimeHeader) 1f else 0f,
                        )
                    }'''
assert old in s, 'chatlist call miss'
s=s.replace(old,new)

old2='''@Composable
private fun ChatTimeHeader(text: String) {
    Box(
        modifier = Modifier
            .fillMaxWidth()
            .padding(vertical = 4.dp),
        contentAlignment = Alignment.Center,
    ) {'''
new2='''@Composable
private fun ChatTimeHeader(text: String, alpha: Float = 1f) {
    Box(
        modifier = Modifier
            .fillMaxWidth()
            .padding(vertical = 4.dp)
            .graphicsLayer { this.alpha = alpha },
        contentAlignment = Alignment.Center,
    ) {'''
assert old2 in s, 'chatlist fn miss'
s=s.replace(old2,new2)

old3='import androidx.compose.ui.graphics.Color'
new3='import androidx.compose.ui.graphics.Color\nimport androidx.compose.ui.graphics.graphicsLayer'
assert old3 in s, 'import miss'
s=s.replace(old3,new3,1)
io.open(p,'w',encoding='utf-8').write(s)
print('chatlist ok')
PY
      - name: patch chatmessage
        run: |
          python3 - <<'PY'
import io
p='app/src/main/java/me/rerere/rikkahub/ui/components/message/ChatMessage.kt'
s=io.open(p,encoding='utf-8').read()

old='''            verticalArrangement = Arrangement.spacedBy(4.dp)
        ) {
        ProvideTextStyle(textStyle) {'''
new='''            verticalArrangement = Arrangement.spacedBy(4.dp)
        ) {
        if (settings.showMessageTimeLabel) {
            Text(
                text = formatMessageTimeLabel(message.createdAt),
                style = MaterialTheme.typography.labelSmall,
                fontSize = 10.sp,
                color = MaterialTheme.colorScheme.onSurfaceVariant.copy(alpha = 0.45f),
                maxLines = 1,
            )
        }
        ProvideTextStyle(textStyle) {'''
assert old in s, 'msg body miss'
s=s.replace(old,new)

old2='''private val ZipMarkRegex = Regex("\\\\[zip:[^\\\\]]+\\\\]", RegexOption.IGNORE_CASE)'''
new2='''private val ZipMarkRegex = Regex("\\\\[zip:[^\\\\]]+\\\\]", RegexOption.IGNORE_CASE)

private fun formatMessageTimeLabel(t: kotlinx.datetime.LocalDateTime): String {
    return "%02d:%02d".format(t.hour, t.minute)
}'''
assert old2 in s, 'regex anchor miss'
s=s.replace(old2,new2,1)
io.open(p,'w',encoding='utf-8').write(s)
print('chatmessage ok')
PY
      - name: commit
        run: |
          rm -f .github/workflows/chat-time-display.yml
          git config user.name solelove
          git config user.email 19372340679@163.com
          git add -A
          git commit -m "feat(ui): 消息时间显示开关 + 左上角小字时间 [skip ci]" || echo nothing
          git push
