name: Apply Time UI Patch

on:
  workflow_dispatch:
  push:
    branches: [ master ]
    paths-ignore:
      - 'app/**'
      - 'common/**'

permissions:
  contents: write

concurrency:
  group: time-ui-patch
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Init needed submodules
        run: git submodule update --init --depth 1 material3/material-color-utilities || true

      - name: Skip if already patched
        id: check
        run: |
          if grep -q "buildReminder" app/src/main/java/me/rerere/rikkahub/data/ai/transformers/TimeReminderTransformer.kt; then
            echo "patched=true" >> $GITHUB_OUTPUT
          else
            echo "patched=false" >> $GITHUB_OUTPUT
          fi

      - name: Apply time ui patch
        if: steps.check.outputs.patched != 'true'
        run: python3 scripts/time_ui_patch.py

      - name: Apply perf hot path patch
        run: python3 scripts/perf_hot_path.py

      - name: Fix part row braces
        run: python3 scripts/fix_part_row.py || true

      - name: Apply user split mode patch
        run: python3 scripts/user_split_independent.py || true

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Create debug keystore
        run: |
          keytool -genkeypair -v \
            -keystore app/debug.keystore \
            -storepass android -keypass android \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          ls -l app/debug.keystore

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-time-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Build debug apk
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleDebug -x :web:buildWebUi --stacktrace 2>&1 | tee build.log

      - name: Dump failure log
        if: failure()
        run: |
          {
            echo "run=${{ github.run_id }} sha=${{ github.sha }}"
            echo "=== kotlin errors ==="
            grep -E "^e: " build.log | head -60 || true
            echo "=== tail ==="
            tail -n 40 build.log || true
          } > ci-last-error.log
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add -f ci-last-error.log
          git commit -m "ci: build error [skip ci]" || true
          git push origin HEAD:master || true

      - name: Publish release
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          ls -l app/build/outputs/apk/debug/
          TAG="split-$(date +%Y%m%d%H%M)"
          echo "tag=$TAG"
          gh release create "$TAG" \
            --title "拆分开关独立 $TAG" \
            --notes "用户气泡拆分开关只看自己：关掉就整条不拆。图片/视频/文档也带头像。" \
            app/build/outputs/apk/debug/*.apk
