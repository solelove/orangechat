name: Patch Time Reminder Injection

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply patch
        run: |
          FILE=app/src/main/java/me/rerere/rikkahub/data/ai/GenerationHandler.kt
          python3 - "$FILE" <<'PY'
          import io, sys
          p = sys.argv[1]
          s = io.open(p, encoding='utf-8').read()
          old = '''val timeReminder = if (assistant.enableTimeReminder) {
                          TimeReminderTransformer.buildReminder(messages)
                      } else null'''
          new = '''// 时间上下文无条件注入 与界面显示解耦
                      val timeReminder = TimeReminderTransformer.buildReminder(messages)'''
          if new in s:
              print("already patched"); sys.exit(0)
          if old not in s:
              print("anchor not found"); sys.exit(1)
          s = s.replace(old, new)
          io.open(p, 'w', encoding='utf-8', newline='').write(s)
          print("patched")
          PY

      - name: Verify
        run: |
          grep -n -A2 "时间上下文无条件注入" app/src/main/java/me/rerere/rikkahub/data/ai/GenerationHandler.kt

      - name: Commit
        run: |
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add -A
          git commit -m "feat(ai): 时间上下文无条件注入 [skip ci]" || echo "nothing to commit"
          git push origin HEAD:master
