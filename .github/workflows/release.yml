name: Release Build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Init needed submodules
        run: |
          git submodule update --init --depth 1 material3/material-color-utilities || true

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up pnpm
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate
          pnpm --version

      - name: Install web deps
        run: |
          if [ -f web-ui/pnpm-lock.yaml ]; then
            pnpm --dir web-ui install --frozen-lockfile
          elif [ -f web-ui/package.json ]; then
            pnpm --dir web-ui install
          else
            echo "没找到 web-ui 目录，跳过"
          fi

      - name: Create release keystore
        run: |
          keytool -genkeypair -v \
            -keystore app/release.keystore \
            -storepass orangechat2026 -keypass orangechat2026 \
            -alias orangechat \
            -keyalg RSA -keysize 2048 -validity 36500 \
            -dname "CN=OrangeChat,O=OrangeChat,C=CN"
          cat > local.properties <<'EOF'
          storeFile=release.keystore
          storePassword=orangechat2026
          keyAlias=orangechat
          keyPassword=orangechat2026
          EOF
          cat local.properties

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Gradle Build
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleRelease 2>&1 | tee build.log

      - name: Dump failure log to repo
        if: failure()
        run: |
          {
            echo "run=${{ github.run_id }} sha=${{ github.sha }}"
            echo "=== kotlin errors ==="
            grep -E "^e: " build.log | head -80 || true
            echo "=== what went wrong ==="
            sed -n '/What went wrong/,/BUILD FAILED/p' build.log | head -60 || true
            echo "=== tail ==="
            tail -n 80 build.log || true
          } > ci-last-error.log
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add -f ci-last-error.log
          git commit -m "ci: dump release build error [skip ci]" || true
          git push origin HEAD:master || true

      - name: Extract version
        if: success()
        id: version
        run: |
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Upload artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: orangechat-release
          path: app/build/outputs/apk/release/*.apk

      - name: Create GitHub Release
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          echo "要发布的 tag: $TAG"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG 已存在，追加 APK"
            gh release upload "$TAG" app/build/outputs/apk/release/*.apk --clobber
          else
            gh release create "$TAG" \
              --title "Release $TAG" \
              --generate-notes \
              app/build/outputs/apk/release/*.apk
          fi
