name: patch

on:
  push:
    branches: [ master ]

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Patch
        run: |
          python3 - <<'PY'
p='app/src/main/java/me/rerere/rikkahub/ui/components/message/ChatMessage.kt'
s=open(p,encoding='utf-8').read()
if 'val textSegmentAvatar' in s:
    print('SKIP already patched')
    open('/tmp/skip','w').write('1')
    raise SystemExit(0)

# A. 用户文本气泡头像
a='''                                        segmentAvatar = if (displaySettings.showUserAvatar)
                                            SegmentAvatarSpec.User(displaySettings.userAvatar, displaySettings.userNickname)
                                        else null,'''
if a not in s: print('A MISSING'); raise SystemExit(1)
s=s.replace(a,'                                        segmentAvatar = textSegmentAvatar,',1)

# B. 助手文本气泡头像
b='''                                            segmentAvatar = when {
                                                !displaySettings.showModelIcon -> null
                                                assistant != null && assistant.useAssistantAvatar ->
                                                    SegmentAvatarSpec.AssistantAvatar(assistant)
                                                model != null -> SegmentAvatarSpec.Model(model.modelId)
                                                else -> null
                                            },'''
if b not in s: print('B MISSING'); raise SystemExit(1)
s=s.replace(b,'                                            segmentAvatar = textSegmentAvatar,',1)

# C. 拆分模式走统一函数
s=s.replace('val splitMode = assistant?.bubbleSplitMode ?: BubbleSplitMode.NONE','val splitMode = resolveSplitMode(false, assistant)')
s=s.replace('mode = assistant?.effectiveUserSplitMode ?: BubbleSplitMode.NONE,','mode = resolveSplitMode(true, assistant),')

# D. 注入 textSegmentAvatar
m='    val partAvatarLoading = loading\n'
if m not in s: print('D MISSING'); raise SystemExit(1)
s=s.replace(m,m+'''    val textSegmentAvatar: SegmentAvatarSpec? = remember(role, assistant, model, displaySettings) {
        segmentAvatarFor(
            isUser = role == MessageRole.USER,
            assistant = assistant,
            model = model,
            userAvatar = displaySettings.userAvatar,
            userNickname = displaySettings.userNickname,
            showUserAvatar = displaySettings.showUserAvatar,
            showModelIcon = displaySettings.showModelIcon,
            showAssistantBubble = displaySettings.showAssistantBubble,
        )
    }
''',1)

open(p,'w',encoding='utf-8').write(s)
print('PATCHED')
PY
      - name: Commit
        run: |
          if [ -f /tmp/skip ]; then echo skip; exit 0; fi
          git config user.name ci-bot
          git config user.email ci-bot@users.noreply.github.com
          git add -A
          git commit -m "fix(ui): 文本气泡头像统一由 segmentAvatarFor 决定 未开拆分不画" || echo nochange
          git push
