name: Build v2.2.3 three fixes + bubble avatar
# rerun trigger: two-system v12（raw 加时间戳绕过 CDN 缓存）

on:
  push:
    paths:
      - '.github/workflows/zz-build-223-all.yml'
      - 'scripts/patch_prompt_two_system.py'
  workflow_dispatch:

permissions:
  contents: write

env:
  BASE_COMMIT: 7b041d773085f87ef6dfc1707c079c5ced96244d

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BASE_COMMIT }}
          fetch-depth: 0
          submodules: recursive

      - name: Check submodule
        run: |
          ls material3/material-color-utilities/kotlin/dynamiccolor | head -5

      - name: Fetch scripts from master
        run: |
          set -euo pipefail
          mkdir -p /tmp/patch
          # base commit (7b041d77) 的 scripts/ 目录里只有早期那批 fix_*.py，
          # 本次构建要用的补丁全部只存在于 master，所以统一从 master 取。
          #
          # 注意：raw.githubusercontent.com 走 Fastly CDN，对 master 这种移动分支
          # 会缓存最多 5 分钟。之前两次 "改了脚本但日志还是旧行为" 就是被缓存坑的。
          # 这里加一个随构建变化的 cache-buster 参数，强制拿到最新内容。
          CB="cb=$(date +%s)-${GITHUB_RUN_ID}"
          for f in TimeReminderTransformer.fixed.kt patch_dummy_theme.py patch_time_header.py patch_avatar_v12.py patch_bubble_v121.py patch_prompt_two_system.py patch_time_tail.py; do
            url="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/master/scripts/${f}?${CB}"
            echo "GET $url"
            rm -f "/tmp/patch/${f}"
            curl -fsSL --retry 3 --retry-delay 2 -H 'Cache-Control: no-cache' -o "/tmp/patch/${f}" "$url"
            if [ ! -s "/tmp/patch/${f}" ]; then echo "EMPTY: $f"; exit 1; fi
            echo "  -> $(wc -c < "/tmp/patch/${f}") bytes  sha=$(sha256sum "/tmp/patch/${f}" | cut -c1-12)"
          done
          # two-system 补丁必须是 v11 及以后（v11 修掉了容器行误报）
          if ! grep -q 'cache-two-system' /tmp/patch/patch_prompt_two_system.py; then
            echo "STALE SCRIPT: patch_prompt_two_system.py (no cache-two-system mark)"; exit 1
          fi
          if ! grep -q 'def normalize(t):' /tmp/patch/patch_prompt_two_system.py; then
            echo "STALE SCRIPT: patch_prompt_two_system.py (old equivalence check, expect v11)"; exit 1
          fi
          if ! grep -q 'line count mismatch' /tmp/patch/patch_prompt_two_system.py; then
            echo "STALE SCRIPT: patch_prompt_two_system.py (missing v11 line-count check)"; exit 1
          fi
          # time-tail 补丁必须走后缀追加那版
          if ! grep -q 'lastUserIndex' /tmp/patch/patch_time_tail.py; then
            echo "STALE SCRIPT: patch_time_tail.py"; exit 1
          fi

      - name: Apply patches
        run: |
          set -euo pipefail
          cp /tmp/patch/TimeReminderTransformer.fixed.kt \
             app/src/main/java/me/rerere/rikkahub/data/ai/transformers/TimeReminderTransformer.kt

          # GenerationHandler：去掉 enableTimeReminder 界面开关，时间始终注入
          python3 - <<'PY'
          import re, sys
          gh = "app/src/main/java/me/rerere/rikkahub/data/ai/GenerationHandler.kt"
          s = open(gh, encoding='utf-8').read()
          new = "val timeReminder = TimeReminderTransformer.buildReminder(messages)"
          if "enableTimeReminder) {" not in s:
              print("condition already gone")
              sys.exit(0)
          pat = re.compile(
              r"val timeReminder = if \(assistant\.enableTimeReminder\) \{\n"
              r"\s*TimeReminderTransformer\.buildReminder\(messages\)\n"
              r"\s*\} else null"
          )
          s2, n = pat.subn(new, s)
          print("replaced", n)
          if n != 1:
              print("ANCHOR NOT FOUND, abort")
              sys.exit(1)
          open(gh, 'w', encoding='utf-8', newline='').write(s2)
          PY

          # 每个补丁单独运行，失败即停并明确指出是哪个脚本
          # 顺序要求：two-system 必须早于 time-tail（time-tail 依赖 system 变量）
          for p in patch_dummy_theme.py patch_time_header.py patch_avatar_v12.py patch_bubble_v121.py patch_prompt_two_system.py patch_time_tail.py; do
            echo "===== running $p ====="
            python3 "/tmp/patch/$p" || { echo "PATCH FAILED: $p"; exit 1; }
          done

      - name: Verify
        run: |
          set -e
          echo "--- time/theme/header ---"
          grep -n "buildReminder" app/src/main/java/me/rerere/rikkahub/data/ai/GenerationHandler.kt
          grep -n "fun dummy()" app/src/main/java/me/rerere/rikkahub/data/datastore/PreferencesStore.kt
          grep -n "一律带上日期" app/src/main/java/me/rerere/rikkahub/ui/pages/chat/ChatList.kt

          echo "--- two-system split + time tail ---"
          GH=app/src/main/java/me/rerere/rikkahub/data/ai/GenerationHandler.kt
          grep -q "val staticSystem = buildString {" $GH
          grep -q "val dynamicSystem = buildString {" $GH
          grep -q "val lastUserIndex = indexOfLast { it.role == MessageRole.USER }" $GH
          grep -q "\[time-tail\]" $GH
          if grep -q "systemWithTime" $GH; then
            echo "ERROR: systemWithTime 还留着，时间没挪出 system"; exit 1
          fi
          python3 - <<'PY'
          s = open("app/src/main/java/me/rerere/rikkahub/data/ai/GenerationHandler.kt", encoding='utf-8').read()
          si = s.index("val staticSystem = buildString {")
          di = s.index("val dynamicSystem = buildString {")
          assert si < di, "static must come before dynamic"
          static_part = s[si:di]
          assert "assistant.systemPrompt" in static_part, "persona must be in static"
          assert "buildCodeBlockPrompt()" in static_part, "codeblock rules must be in static"
          assert "## Message Bubbles" in static_part, "bubble rules must be in static"
          assert "buildMemoryPrompt" not in static_part, "memory must not be in static"
          assert "tools.forEach" not in static_part, "tool prompts must not be in static"
          assert "External memory recall failed" not in static_part, "external recall must not be in static"
          assert "buildRecentChatsPrompt" not in static_part, "recent chats must not be in static"
          dyn = s[di:]
          assert "buildMemoryPrompt" in dyn, "memory must be in dynamic"
          assert "tools.forEach" in dyn, "tool prompts must be in dynamic"
          assert dyn.index("buildMemoryPrompt") < dyn.index("External memory recall failed")
          assert dyn.index("buildMemoryPrompt") < dyn.index("buildRecentChatsPrompt")
          i_sys = s.index("add(UIMessage.system(prompt = system))")
          i_lim = s.index("addAll(messages.limitContext(assistant.contextMessageSize))")
          i_tail = s.index("val lastUserIndex = indexOfLast")
          assert i_sys < i_lim < i_tail, "order wrong: system -> limitContext -> time tail"
          assert s.count("{") == s.count("}"), "brace imbalance"
          print("two-system split + time tail OK")
          PY

          CM=app/src/main/java/me/rerere/rikkahub/ui/components/message/ChatMessage.kt
          echo "--- avatar v12 wiring ---"
          grep -n "textSegmentAvatar\|partAvatarSpec" $CM

          if grep -q "!shouldHideSideAvatar(" $CM; then
            echo "ERROR: 外层侧边头像没删干净"; exit 1
          fi
          if grep -nE "^[[:space:]]*ChatMessageSideAvatar\(" $CM; then
            echo "ERROR: ChatMessageSideAvatar 仍被调用"; exit 1
          fi
          if grep -nE "^[[:space:]]*ChatMessageSideUserAvatar\(" $CM; then
            echo "ERROR: ChatMessageSideUserAvatar 仍被调用"; exit 1
          fi
          grep -qE "^private fun ChatMessageSideAvatar\(" $CM
          grep -qE "^private fun ChatMessageSideUserAvatar\(" $CM

          grep -q "val textSegmentAvatar: SegmentAvatarSpec? = remember(" $CM
          grep -q "val partAvatarSpec: SegmentAvatarSpec? = textSegmentAvatar" $CM
          grep -q "segmentAvatar = textSegmentAvatar," $CM
          if grep -q "if (!splitOn) null" $CM; then
            echo "ERROR: 段头像仍受拆分开关限制"; exit 1
          fi
          grep -q "internal fun AudioPlayerBubble(url: String) {" $CM
          grep -q "internal fun VoiceMessageBubble(" $CM

          BS=app/src/main/java/me/rerere/rikkahub/ui/components/message/BubbleSurface.kt
          echo "--- bubble v12.1 wiring ---"
          grep -n "不开拆分也要带头像" $BS
          grep -n "singleAvatarSpace\|singleMaxWidth\|singleRightSide" $BS
          if ! grep -q "singleAvatarSpace = if (segmentAvatar != null)" $BS; then
            echo "ERROR: 不开拆分分支没有头像占用宽度"; exit 1
          fi
          if ! grep -q "SegmentAvatarView(segmentAvatar, avatarLoading)" $BS; then
            echo "ERROR: SegmentAvatarView 没被调用"; exit 1
          fi
          grep -q "val segments = remember(text, mode) { splitByMode(text, mode) }" $BS
          grep -q "fun BubbleSurface(" $BS
          echo "assert OK"

      - name: Verify diff scope
        run: |
          git --no-pager diff --stat
          BAD=$(git --no-pager diff --name-only | grep -vE "TimeReminderTransformer\.kt|GenerationHandler\.kt|PreferencesStore\.kt|ChatList\.kt|ChatMessage\.kt|BubbleSurface\.kt" || true)
          if [ -n "$BAD" ]; then echo "UNEXPECTED: $BAD"; exit 1; fi
          echo "scope OK"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build web-ui before gradle
        run: |
          cd web-ui
          export COREPACK_ENABLE_STRICT=0
          pnpm install --ignore-workspace --no-frozen-lockfile
          pnpm --ignore-workspace run build
          ls -la ../web/src/main/resources/static | head -20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: keystore
        run: |
          keytool -genkeypair -v -keystore app/release.keystore -storepass orangechat2026 -keypass orangechat2026 -alias orangechat -keyalg RSA -keysize 2048 -validity 36500 -dname "CN=OrangeChat,O=OrangeChat,C=CN"
          printf 'storeFile=release.keystore\nstorePassword=orangechat2026\nkeyAlias=orangechat\nkeyPassword=orangechat2026\n' > local.properties

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-223-av18-${{ hashFiles('**/*.gradle*') }}

      - name: Build release
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleRelease -x :web:buildWebUi 2>&1 | tee build.log

      - name: Dump failure
        if: failure()
        run: |
          grep -E "^e: " build.log | head -60 || true
          tail -n 100 build.log || true

      - name: Publish
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="223-all-av-$(date +%Y%m%d%H%M)"
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --title "v2.2.3 三处修复 + 头像 v12.1 + 两条 system + 时间挪末尾" \
            --notes "基于 v2.2.3 标签 7b041d77。1) 时间上下文去掉界面开关限制，每次取真实当前时间。2) 启动加载期间主题不再闪粉。3) 时间条非今天的消息显示月日+时分。4) 头像 v12.1：不开拆分时气泡旁边也有一个头像；文字段、图片段各带一个；外层不再单独画；思考块、工具块不带头像。5) system 拆成两条消息：静态段（人格 + 代码块规则 + Skip/Jump + 气泡）固定在最前永远命中缓存；动态段（记忆 + 外置召回 + 最近会话 + 工具 + 插件）单独一条，怎么变都不影响前面。6) 时间提醒从 system 移出，追加到消息列表末尾。界面完全没动。" \
            app/build/outputs/apk/release/*.apk
