      - name: Publish
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="223-all-av-$(date +%Y%m%d%H%M)"
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --title "v2.2.3 三处修复 + 单头像 v11" \
            --notes "基于 v2.2.3 标签 7b041d77。1) 时间上下文去掉界面开关限制，每次取真实当前时间。2) 启动加载期间主题不再闪粉。3) 时间条非今天的消息显示月日+时分。4) 头像归属按拆分开关一刀切：开了拆分每段自带，没开拆分外层只画一个侧边头像（纯文字、带思考块、文字+图片混排都是同一个），图片段不再单独画。" \
            app/build/outputs/apk/release/*.apk
