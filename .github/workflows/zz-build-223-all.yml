name: Build v2.2.3 three fixes + bubble avatar

on:
  push:
    paths:
      - '.github/workflows/zz-build-223-all.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GH_OWNER: solelove
      GH_REPO: orangechat
      GH_REF: master
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 7b041d773085f87ef6dfc1707c079c5ced96244d
          fetch-depth: 0
          submodules: recursive

      - name: Check submodule
        run: |
          ls material3/material-color-utilities/kotlin/dynamiccolor | head -5

      - name: Fetch scripts from master
        run: |
          set -e
          fetch() {
            local src="$1" dst="$2"
            local url="https://raw.githubusercontent.com/${GH_OWNER}/${GH_REPO}/${GH_REF}/scripts/${src}"
            echo "GET $url"
            curl -sSL --retry 3 --retry-delay 2 -o "$dst" "$url"
            if [ ! -s "$dst" ]; then echo "EMPTY: $url"; exit 1; fi
            echo "  -> $(wc -c < "$dst") bytes"
          }
          fetch TimeReminderTransformer.fixed.kt /tmp/TimeReminderTransformer.fixed.kt
          fetch patch_dummy_theme.py /tmp/patch_dummy_theme.py
          fetch patch_time_header.py /tmp/patch_time_header.py
          fetch patch_avatar_v12.py /tmp/patch_avatar_v12.py

      - name: Apply patches
        run: |
          set -e
          cp /tmp/TimeReminderTransformer.fixed.kt app/src/main/java/me/rerere/rikkahub/data/ai/transformers/TimeReminderTransformer.kt
          python3 - <<'PY'
          import re, sys
          gh = "app/src/main/java/me/rerere/rikkahub/data/ai/GenerationHandler.kt"
          s = open(gh, encoding='utf-8').read()
          new = "val timeReminder = TimeReminderTransformer.buildReminder(messages)"
          if "enableTimeReminder) {" not in s:
              print("condition already gone")
          else:
              pat = re.compile(
                  r"val timeReminder = if \(assistant\.enableTimeReminder\) \{\n"
                  r"\s*TimeReminderTransformer\.buildReminder\(messages\)\n"
                  r"\s*\} else null"
              )
              s2, n = pat.subn(new, s)
              print("replaced", n)
              if n != 1:
                  print("ANCHOR NOT FOUND, abort")
                  sys.exit(1)
              open(gh, 'w', encoding='utf-8', newline='').write(s2)
          PY
          python3 /tmp/patch_dummy_theme.py
          python3 /tmp/patch_time_header.py
          python3 /tmp/patch_avatar_v12.py

      - name: Verify
        run: |
          set -e
          echo "--- time/theme/header ---"
          grep -n "buildReminder" app/src/main/java/me/rerere/rikkahub/data/ai/GenerationHandler.kt
          grep -n "fun dummy()" app/src/main/java/me/rerere/rikkahub/data/datastore/PreferencesStore.kt
          grep -n "一律带上日期" app/src/main/java/me/rerere/rikkahub/ui/pages/chat/ChatList.kt

          CM=app/src/main/java/me/rerere/rikkahub/ui/components/message/ChatMessage.kt
          echo "--- avatar v12 wiring ---"
          grep -n "textSegmentAvatar\|partAvatarSpec" $CM

          # 外层不能再调 shouldHideSideAvatar
          if grep -q "!shouldHideSideAvatar(" $CM; then
            echo "ERROR: 外层侧边头像没删干净"; exit 1
          fi

          # 只检查"调用"，不检查函数定义。定义留在文件里只会产生 unused warning，
          # 不影响编译；把定义也算进去会把正确的补丁误判成失败。
          # 调用行形如「            ChatMessageSideAvatar(」，前面是纯缩进；
          # 定义行形如「private fun ChatMessageSideAvatar(」，前面有 fun。
          if grep -nE "^[[:space:]]*ChatMessageSideAvatar\(" $CM; then
            echo "ERROR: ChatMessageSideAvatar 仍被调用"; exit 1
          fi
          if grep -nE "^[[:space:]]*ChatMessageSideUserAvatar\(" $CM; then
            echo "ERROR: ChatMessageSideUserAvatar 仍被调用"; exit 1
          fi
          # 定义必须还在（补丁不该动它们）
          grep -qE "^private fun ChatMessageSideAvatar\(" $CM
          grep -qE "^private fun ChatMessageSideUserAvatar\(" $CM

          grep -q "val textSegmentAvatar: SegmentAvatarSpec? = remember(" $CM
          grep -q "val partAvatarSpec: SegmentAvatarSpec? = textSegmentAvatar" $CM
          grep -q "segmentAvatar = textSegmentAvatar," $CM
          # 拆分开关不该再影响段头像
          if grep -q "if (!splitOn) null" $CM; then
            echo "ERROR: 段头像仍受拆分开关限制"; exit 1
          fi
          # 基线里的播放器组件必须还在
          grep -q "internal fun AudioPlayerBubble(url: String) {" $CM
          grep -q "internal fun VoiceMessageBubble(" $CM
          echo "assert OK"

      - name: Verify diff scope
        run: |
          git --no-pager diff --stat
          BAD=$(git --no-pager diff --name-only | grep -vE "TimeReminderTransformer\.kt|GenerationHandler\.kt|PreferencesStore\.kt|ChatList\.kt|ChatMessage\.kt" || true)
          if [ -n "$BAD" ]; then echo "UNEXPECTED: $BAD"; exit 1; fi
          echo "scope OK"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build web-ui before gradle
        run: |
          cd web-ui
          export COREPACK_ENABLE_STRICT=0
          pnpm install --ignore-workspace --no-frozen-lockfile
          pnpm --ignore-workspace run build
          ls -la ../web/src/main/resources/static | head -20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: keystore
        run: |
          keytool -genkeypair -v -keystore app/release.keystore -storepass orangechat2026 -keypass orangechat2026 -alias orangechat -keyalg RSA -keysize 2048 -validity 36500 -dname "CN=OrangeChat,O=OrangeChat,C=CN"
          printf 'storeFile=release.keystore\nstorePassword=orangechat2026\nkeyAlias=orangechat\nkeyPassword=orangechat2026\n' > local.properties

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-223-av15-${{ hashFiles('**/*.gradle*') }}

      - name: Build release
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleRelease -x :web:buildWebUi 2>&1 | tee build.log

      - name: Dump failure
        if: failure()
        run: |
          grep -E "^e: " build.log | head -60 || true
          tail -n 100 build.log || true

      - name: Publish
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="223-all-av-$(date +%Y%m%d%H%M)"
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --title "v2.2.3 三处修复 + 段头像 v12" \
            --notes "基于 v2.2.3 标签 7b041d77。1) 时间上下文去掉界面开关限制，每次取真实当前时间。2) 启动加载期间主题不再闪粉。3) 时间条非今天的消息显示月日+时分。4) 头像 v12：不开拆分时文字段和图片段也各自带一个头像，外层不再单独画；思考块、工具块不带头像。" \
            app/build/outputs/apk/release/*.apk
