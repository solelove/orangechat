name: Per Bubble Avatar Debug

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/v2.2.3
          fetch-depth: 0

      - name: Apply patches
        run: |
          cat > /tmp/p.b64 <<'B64EOF'
          
          B64EOF
          tr -d ' \n' < /tmp/p.b64 | base64 -d > /tmp/p.py
          python3 /tmp/p.py

      - name: Diff
        run: |
          git --no-pager diff --stat
          echo "=== BubbleSurface check ==="
          grep -n "isRightSidePlain" app/src/main/java/me/rerere/rikkahub/ui/components/message/BubbleSurface.kt || echo "NO MATCH"
          echo "=== AvatarVisibility ==="
          sed -n '20,40p' app/src/main/java/me/rerere/rikkahub/ui/components/message/AvatarVisibility.kt

      - name: Init submodules
        run: git submodule update --init --depth 1 material3/material-color-utilities || true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: pnpm
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate
          pnpm --version

      - name: web deps
        run: |
          if [ -f web-ui/pnpm-lock.yaml ]; then pnpm --dir web-ui install --frozen-lockfile
          elif [ -f web-ui/package.json ]; then pnpm --dir web-ui install
          else echo skip; fi

      - name: keystore
        run: |
          keytool -genkeypair -v \
            -keystore app/release.keystore \
            -storepass orangechat2026 -keypass orangechat2026 \
            -alias orangechat -keyalg RSA -keysize 2048 -validity 36500 \
            -dname "CN=OrangeChat,O=OrangeChat,C=CN"
          cat > local.properties <<'EOF'
          storeFile=release.keystore
          storePassword=orangechat2026
          keyAlias=orangechat
          keyPassword=orangechat2026
          EOF

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-223-av2-${{ hashFiles('**/*.gradle*') }}

      - name: Build
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleRelease 2>&1 | tee build.log

      - name: Dump error to repo
        if: failure()
        run: |
          {
            echo "run=${{ github.run_id }}"
            echo "=== kotlin errors ==="
            grep -E "^e: " build.log | head -60 || true
            echo "=== what went wrong ==="
            sed -n '/What went wrong/,/BUILD FAILED/p' build.log | head -80 || true
            echo "=== tail ==="
            tail -n 60 build.log || true
          } > ci-avatar-error.log
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add -f ci-avatar-error.log
          git commit -m "ci: avatar build error [skip ci]" || true
          git push origin HEAD:master || true

      - name: Publish
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="223-avatar-$(date +%Y%m%d%H%M)"
          gh release create "$TAG" \
            --title "v2.2.3 每气泡带头像" \
            --notes "基于 v2.2.3 每个气泡和每张图片后面都带头像" \
            app/build/outputs/apk/release/*.apk
