name: soften-pass4
on:
  push:
    paths:
      - '.github/workflows/soften-pass4.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: patch
        run: |
          F=app/src/main/java/me/rerere/rikkahub/data/service/ProactiveMessageService.kt
          python3 - "$F" <<'PY'
import sys, io
p = sys.argv[1]
s = io.open(p, encoding='utf-8').read()
reps = [
 ("请根据以上用户动向决定是否发消息。没什么好说的就回复 [PASS]。",
  "请根据以上用户动向主动发一条消息，自然一点，像忽然想起她。"),
 ("如果你觉得现在没什么好说的，或者没什么有趣的话题，请只回复 [PASS] 即可。",
  "默认应当发消息。请主动找个小话题，或者轻松地问候她一句。"),
]
for a, b in reps:
    print(s.count(a), '->', a[:14])
    s = s.replace(a, b)
io.open(p, 'w', encoding='utf-8').write(s)
PY
          grep -c "PASS" "$F" || true
          git config user.name solelove
          git config user.email 19372340679@163.com
          git add -A
          git diff --cached --quiet || git commit -m "fix(proactive): 补齐剩余 PASS 提示词"
          git push
