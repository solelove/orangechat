name: NonText Avatar

on:
  push:
    branches: [ master ]
    paths:
      - 'scripts/nontext_avatar.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nontext-avatar
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Init needed submodules
        run: git submodule update --init --depth 1 material3/material-color-utilities || true

      - name: Apply patch
        run: python3 scripts/nontext_avatar.py

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Create debug keystore
        run: |
          keytool -genkeypair -v \
            -keystore app/debug.keystore \
            -storepass android -keypass android \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-nontext-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Build debug apk
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleDebug -x :web:buildWebUi --stacktrace 2>&1 | tee build.log

      - name: Dump failure log
        if: failure()
        run: |
          {
            echo "run=${{ github.run_id }} sha=${{ github.sha }}"
            echo "=== kotlin errors ==="
            grep -E "^e: " build.log | head -60 || true
            echo "=== tail ==="
            tail -n 60 build.log || true
          } > ci-last-error.log
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add -f ci-last-error.log
          git commit -m "ci: nontext error [skip ci]" || true
          git push origin HEAD:master || true

      - name: Publish release
        if: success()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          TAG="nontext-$VERSION-$(date +%Y%m%d%H%M)"
          gh release create "$TAG" \
            --title "图片带头像版 $TAG" \
            --notes "拆分气泡时图片/视频/文档也带头像；流畅版改动保留" \
            app/build/outputs/apk/debug/*.apk

      - name: Commit patched source
        if: success()
        run: |
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add -A
          git commit -m "feat(ui): 图片段带头像 [skip ci]" || true
          git push origin HEAD:master || true
