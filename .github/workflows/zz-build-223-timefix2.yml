name: Build v2.2.3 time inject fixed v2

on:
  push:
    paths:
      - '.github/workflows/zz-build-223-timefix2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 7b041d773085f87ef6dfc1707c079c5ced96244d
          fetch-depth: 0

      - name: Patch GenerationHandler
        run: |
          python3 - <<'PY'
          import re, sys
          gh = "app/src/main/java/me/rerere/rikkahub/data/ai/GenerationHandler.kt"
          s = open(gh, encoding='utf-8').read()
          pat = re.compile(
              r"val timeReminder = if \(assistant\.enableTimeReminder\) \{\s*"
              r"TimeReminderTransformer\.buildReminder\(messages\)\s*\} else null"
          )
          new = "val timeReminder = TimeReminderTransformer.buildReminder(messages)"
          if new in s and "enableTimeReminder) {" not in s:
              print("already patched, skip")
          else:
              s2, n = pat.subn(new, s)
              print("replaced", n)
              if n != 1:
                  print("ANCHOR NOT FOUND, abort")
                  sys.exit(1)
              open(gh, 'w', encoding='utf-8', newline='').write(s2)
          PY
          grep -n "buildReminder" app/src/main/java/me/rerere/rikkahub/data/ai/GenerationHandler.kt

      - name: Rewrite TimeReminderTransformer
        run: |
          cat > app/src/main/java/me/rerere/rikkahub/data/ai/transformers/TimeReminderTransformer.kt <<'KT'
/*
 * 橘瓣 OrangeChat
 * 衍生自 RikkaHub (https://github.com/rikkahub/rikkahub)，原作者 RE
 * 本项目基于 GNU AGPL v3 开源，详见根目录 LICENSE 文件
 */

package me.rerere.rikkahub.data.ai.transformers

import kotlinx.datetime.LocalDateTime
import kotlinx.datetime.TimeZone
import kotlinx.datetime.toInstant
import kotlinx.datetime.toLocalDateTime
import me.rerere.ai.core.MessageRole
import me.rerere.ai.ui.UIMessage
import kotlin.time.Clock

private const val TIME_GAP_THRESHOLD_SECONDS = 60L

/**
 * 时间提醒生成器
 *
 * 每次生成都把真实当前时间拼进系统提示，不再依赖界面开关，
 * 也不再拿上一条消息的 createdAt 冒充现在。
 */
object TimeReminderTransformer : InputMessageTransformer {
    override suspend fun transform(
        ctx: TransformerContext,
        messages: List<UIMessage>,
    ): List<UIMessage> = messages

    /** 生成当前时间提醒文本；永远不为 null。 */
    fun buildReminder(messages: List<UIMessage>): String? {
        val tz = TimeZone.currentSystemDefault()
        val now = Clock.System.now().toLocalDateTime(tz)

        val userMessages = messages.filter { it.role == MessageRole.USER }
        val prev = userMessages.dropLast(1).lastOrNull()?.createdAt
        val gapSeconds = prev?.let {
            (now.toInstant(tz) - it.toInstant(tz)).inWholeSeconds
        }

        return buildTimeReminderText(
            gapSeconds = gapSeconds?.takeIf { it > TIME_GAP_THRESHOLD_SECONDS },
            time = now
        )
    }
}

/** 旧接口保留：把提醒以 user 消息形式注入（默认不再使用）。 */
internal fun applyTimeReminder(messages: List<UIMessage>): List<UIMessage> = messages

internal fun buildTimeReminderText(gapSeconds: Long?, time: LocalDateTime): String {
    val dayOfWeek = time.dayOfWeek.name.lowercase().replaceFirstChar { it.uppercase() }
    val timeStr = String.format(
        java.util.Locale.US, "%04d-%02d-%02d %02d:%02d",
        time.year, time.monthNumber, time.dayOfMonth, time.hour, time.minute
    )
    val head = "<time_reminder>Current time: $dayOfWeek, $timeStr"
    return if (gapSeconds != null) {
        "$head (${formatGap(gapSeconds)} since last message)</time_reminder>"
    } else {
        "$head</time_reminder>"
    }
}

private fun formatGap(seconds: Long): String {
    return when {
        seconds < 3600 -> "${seconds / 60} min"
        seconds < 86400 -> "${seconds / 3600} h"
        else -> "${seconds / 86400} d"
    }
}
KT
          echo "----- transformer head -----"
          sed -n '1,60p' app/src/main/java/me/rerere/rikkahub/data/ai/transformers/TimeReminderTransformer.kt

      - name: Verify diff scope
        run: |
          git --no-pager diff --stat
          echo "----- changed -----"
          git --no-pager diff --name-only
          BAD=$(git --no-pager diff --name-only | grep -vE "TimeReminderTransformer\.kt|GenerationHandler\.kt" || true)
          if [ -n "$BAD" ]; then echo "UNEXPECTED: $BAD"; exit 1; fi
          echo "scope OK"

      - name: Init submodules
        run: git submodule update --init --depth 1 material3/material-color-utilities || true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: pnpm
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate
          if [ -f web-ui/pnpm-lock.yaml ]; then pnpm --dir web-ui install --frozen-lockfile
          elif [ -f web-ui/package.json ]; then pnpm --dir web-ui install
          else echo no-web; fi

      - name: keystore
        run: |
          keytool -genkeypair -v -keystore app/release.keystore -storepass orangechat2026 -keypass orangechat2026 -alias orangechat -keyalg RSA -keysize 2048 -validity 36500 -dname "CN=OrangeChat,O=OrangeChat,C=CN"
          printf 'storeFile=release.keystore\nstorePassword=orangechat2026\nkeyAlias=orangechat\nkeyPassword=orangechat2026\n' > local.properties

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-223-tf2-${{ hashFiles('**/*.gradle*') }}

      - name: Build release
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleRelease 2>&1 | tee build.log

      - name: Dump failure
        if: failure()
        run: |
          grep -E "^e: " build.log | head -60 || true
          tail -n 80 build.log || true

      - name: Publish
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="223-timefix2-$(date +%Y%m%d%H%M)"
          gh release create "$TAG" \
            --title "v2.2.3 时间注入修复" \
            --notes "基于 v2.2.3 标签。时间上下文去掉界面开关限制，改为每次取真实当前时间（含年月日时分），间隔超 60 秒附上距上一条的时长。只改 GenerationHandler.kt 和 TimeReminderTransformer.kt。" \
            app/build/outputs/apk/release/*.apk
