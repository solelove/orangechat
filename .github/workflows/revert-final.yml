name: revert-final
on:
  push:
    branches: [master]
jobs:
  revert:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: revert prompts and self-delete
        run: |
          F=app/src/main/java/me/rerere/rikkahub/data/service/ProactiveMessageService.kt
          python3 - "$F" <<'PY'
import sys, io
p = sys.argv[1]
s = io.open(p, encoding='utf-8').read()
reps = [
 ("请根据以上用户动向主动发一条消息，自然一点，像忽然想起她。",
  "请根据以上用户动向决定是否发消息。没什么好说的就回复 [PASS]。"),
 ("请根据以上上下文决定是否发消息。想发就发，自然一点，像突然想起她一样。",
  "请根据以上上下文决定是否发消息。没什么好说的就回复 [PASS] 即可，不要强行找话题。"),
 ("默认应当发消息。请主动找个小话题，或者轻松地问候她一句。",
  "如果你觉得现在没什么好说的，或者没什么有趣的话题，请只回复 [PASS] 即可。"),
 ("默认应当发消息，除非你确实完全想不到任何可说的话题。",
  "如果你觉得现在没什么好说的，或者没什么有趣的话题，请只回复 [PASS] 即可。"),
]
for a, b in reps:
    n = s.count(a)
    print(n, '<-', a[:16])
    s = s.replace(a, b)
io.open(p, 'w', encoding='utf-8').write(s)
PY
          rm -f .github/workflows/revert-final.yml
          git config user.name solelove
          git config user.email 19372340679@163.com
          git add -A
          git commit -m "revert(proactive): 恢复原提示词并清理 workflow [skip ci]" || echo nothing
          git push
