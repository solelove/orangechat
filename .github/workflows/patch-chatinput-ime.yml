name: patch-chatinput-ime
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/patch-chatinput-ime.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: remove duplicated imePadding in ChatInput
        run: |
          F=app/src/main/java/me/rerere/rikkahub/ui/components/ai/ChatInput.kt
          if grep -q "            modifier = modifier$" "$F"; then
            perl -0pi -e 's/verbatim_placeholder//' "$F"
          fi
          perl -0pi -e 's/        Column\(\n            modifier = modifier\n                \.imePadding\(\)\n                \.navigationBarsPadding\(\)/        Column(\n            modifier = modifier\n                .navigationBarsPadding()/' "$F"
          grep -n "navigationBarsPadding" "$F" | head -5
      - name: commit
        run: |
          git config user.name "solelove"
          git config user.email "19372340679@163.com"
          git add -A
          git diff --cached --quiet || git commit -m "fix(chat): 移除 ChatInput 多余的 imePadding，避免键盘弹出时双重测量"
          git push
