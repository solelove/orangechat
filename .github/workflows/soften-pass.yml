name: soften-pass
on:
  workflow_dispatch:
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: patch
        run: |
          F=app/src/main/java/me/rerere/rikkahub/data/service/ProactiveMessageService.kt
          cp "$F" /tmp/before.kt
          perl -0pi -e 's/没什么好说的就回复 \[PASS\] 即可，不要强行找话题。/想发就发，自然一点，像突然想起她一样；只有实在没什么话可讲时才回复 [PASS]。/' "$F"
          perl -0pi -e 's/如果你觉得现在没什么好说的，或者没什么有趣的话题，请只回复 \[PASS\] 即可。/默认应当发消息。只有在你确实完全想不到任何可说的话题时，才回复 [PASS]。/' "$F"
          perl -0pi -e 's/如果你觉得现在没什么好说的，或者没什么有趣的话题，请只回复 \[PASS\] 即可。/默认应当发消息。只有在你确实完全想不到任何可说的话题时，才回复 [PASS]。/g' "$F"
          diff /tmp/before.kt "$F" || true
          git config user.name solelove
          git config user.email 19372340679@163.com
          git add -A
          git diff --cached --quiet || git commit -m "fix(proactive): 放宽 PASS 判定，默认倾向发消息"
          git push
