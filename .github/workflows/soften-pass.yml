name: soften-pass
on:
  push:
    paths:
      - 'app/src/main/java/me/rerere/rikkahub/data/service/ProactiveMessageService.kt'
      - '.github/workflows/soften-pass.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: patch
        run: |
          F=app/src/main/java/me/rerere/rikkahub/data/service/ProactiveMessageService.kt
          cp "$F" /tmp/before.kt
          perl -0pi -e 's/没什么好说的就回复 \[PASS\] 即可，不要强行找话题。/想发就发，自然一点，像突然想起她一样。/' "$F"
          perl -0pi -e 's/如果你觉得现在没什么好说的，或者没什么有趣的话题，请只回复 \[PASS\] 即可。/默认应当发消息，除非你确实完全想不到任何可说的话题。/' "$F"
          perl -0pi -e 's/请根据以上上下文决定是否发消息。没什么好说的就回复 \[PASS\] 即可，不要强行找话题。/请根据以上上下文主动发一条消息。/' "$F"
          perl -0pi -e 's/请根据以上上下文决定是否发消息。没什么好说的就回复 \[PASS\] 即可，不要强行找话题。/请根据以上上下文主动发一条消息。/g' "$F"
          grep -n "默认应当发消息" "$F" || echo "no-match-1"
          grep -n "想发就发" "$F" || echo "no-match-2"
          diff /tmp/before.kt "$F" > /tmp/d.txt || true
          cat /tmp/d.txt | head -40
          git config user.name solelove
          git config user.email 19372340679@163.com
          git add -A
          git diff --cached --quiet || git commit -m "fix(proactive): 放宽 PASS 判定，默认倾向发消息"
          git push
