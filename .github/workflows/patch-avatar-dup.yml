name: patch-avatar-dup

on:
  push:
    paths:
      - '.patch-avatar-dup'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - name: Apply patch
        run: |
          python3 - <<'PY'
          p = 'app/src/main/java/me/rerere/rikkahub/ui/components/message/ChatMessage.kt'
          s = open(p, encoding='utf-8').read()

          # 1. 助手外层头像判断加 hasNonTextParts
          old_a = '''&& !shouldHideSideAvatar(false, settings.showUserAvatar, settings.showModelIcon, settings.showAssistantBubble, assistant)) {'''
          new_a = '''&& !shouldHideSideAvatar(false, settings.showUserAvatar, settings.showModelIcon, settings.showAssistantBubble, assistant, message.parts.any { it !is UIMessagePart.Text })) {'''
          assert old_a in s, 'A not found'
          s = s.replace(old_a, new_a, 1)

          # 2. 用户外层头像判断同理
          old_u = '''&& !shouldHideSideAvatar(true, settings.showUserAvatar, settings.showModelIcon, settings.showAssistantBubble, assistant)) {'''
          new_u = '''&& !shouldHideSideAvatar(true, settings.showUserAvatar, settings.showModelIcon, settings.showAssistantBubble, assistant, message.parts.any { it !is UIMessagePart.Text })) {'''
          assert old_u in s, 'U not found'
          s = s.replace(old_u, new_u, 1)

          open(p, 'w', encoding='utf-8').write(s)
          print('patched ok')
          PY

      - name: Verify
        run: |
          grep -c "hasNonTextParts\|message.parts.any { it !is UIMessagePart.Text }" app/src/main/java/me/rerere/rikkahub/ui/components/message/ChatMessage.kt || true

      - name: Commit
        run: |
          git config user.name solelove
          git config user.email 19372340679@163.com
          git add app/src/main/java/me/rerere/rikkahub/ui/components/message/ChatMessage.kt
          git commit -m "fix: 调用处传入非文本段标记 修补双头像" || echo nothing
          git push

      - name: Cleanup
        run: |
          rm -f .patch-avatar-dup
          git add -A
          git commit -m "chore: 清理补丁触发文件" || echo nothing
          git push || true
