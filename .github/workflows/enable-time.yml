name: enable-time-default
on: push
permissions:
  contents: write
jobs:
  p:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: apply
        run: |
          cat > /tmp/p.py <<'PYEOF'
          import io, sys
          p = 'app/src/main/java/me/rerere/rikkahub/data/model/Assistant.kt'
          s = io.open(p, encoding='utf-8').read()
          old = "    val enableTimeReminder: Boolean = false,            // 时间间隔提醒注入"
          new = "    val enableTimeReminder: Boolean = true,             // 时间间隔提醒注入（默认开启）"
          if old not in s:
              print('MISS'); sys.exit(1)
          s = s.replace(old, new, 1)
          io.open(p, 'w', encoding='utf-8').write(s)
          print('OK')

          # 强制注入：即使助手设置为关，也照样注入时间
          g = 'app/src/main/java/me/rerere/rikkahub/data/ai/GenerationHandler.kt'
          t = io.open(g, encoding='utf-8').read()
          old2 = """            val timeReminder = if (assistant.enableTimeReminder) {
                TimeReminderTransformer.buildReminder(messages)
            } else null"""
          new2 = """            // 时间上下文一律注入：这是 AI 判断\"现在几点\"的唯一来源，
            // 与界面上是否显示时间无关，也不允许被助手开关关掉。
            val timeReminder = TimeReminderTransformer.buildReminder(messages)"""
          if old2 not in t:
              print('MISS gen'); sys.exit(1)
          t = t.replace(old2, new2, 1)
          io.open(g, 'w', encoding='utf-8').write(t)
          print('OK gen')
          PYEOF
          python3 /tmp/p.py
      - name: commit
        run: |
          git config user.name solelove
          git config user.email 19372340679@163.com
          git add -A
          git diff --cached --quiet && echo none || git commit -m "fix(time): 时间上下文默认注入 [skip ci]"
          git push
