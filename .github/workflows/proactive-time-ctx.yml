name: proactive-time-ctx
on:
  push:
    branches: [master]
jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: patch
        run: |
          F=app/src/main/java/me/rerere/rikkahub/data/service/ProactiveMessageService.kt
          python3 - "$F" <<'PY'
import sys, io
p = sys.argv[1]
s = io.open(p, encoding='utf-8').read()

old_time = '''        // Current time
        val currentTime = java.lang.System.currentTimeMillis()
        val sdf = java.text.SimpleDateFormat("yyyy-MM-dd HH:mm:ss", java.util.Locale.getDefault())
        sb.appendLine("当前时间: ${sdf.format(java.util.Date(currentTime))}")
'''
new_time = '''        // Current time - 放在最前面并压进最近几条对话的时间线里，方便判断"现在该不该说话"
        val currentTime = java.lang.System.currentTimeMillis()
        val sdf = java.text.SimpleDateFormat("yyyy-MM-dd HH:mm:ss EEEE", java.util.Locale.CHINA)
        sb.appendLine("当前时间: ${sdf.format(java.util.Date(currentTime))}")
        // 最近几条消息的时间，帮它感知对话节奏
        try {
            val settings0 = settingsStore.settingsFlow.first()
            val convs = conversationRepository.getRecentConversations(settings0.assistantId, limit = 1)
            if (convs.isNotEmpty()) {
                val full = conversationRepository.getConversationById(convs.first().id)
                val recent = full?.messageNodes?.takeLast(6) ?: emptyList()
                if (recent.isNotEmpty()) {
                    sb.appendLine("最近对话时间线:")
                    recent.forEach { node ->
                        val m = node.currentMessage
                        val role = when (m.role) {
                            me.rerere.ai.core.MessageRole.USER -> "她"
                            me.rerere.ai.core.MessageRole.ASSISTANT -> "你"
                            else -> "系统"
                        }
                        val t = m.createdAt
                        sb.appendLine("  - $role %02d-%02d %02d:%02d".format(t.monthNumber, t.dayOfMonth, t.hour, t.minute))
                    }
                }
            }
        } catch (e: Exception) {
            Log.w(TAG, "Failed to build recent timeline", e)
        }
'''
if old_time not in s:
    print("MISS time block")
else:
    s = s.replace(old_time, new_time)
    print("OK time block")

old_head = '''        sb.appendLine("[主动消息上下文]")
'''
new_head = '''        sb.appendLine("[主动消息上下文]")
'''
io.open(p, 'w', encoding='utf-8').write(s)
PY
          rm -f .github/workflows/proactive-time-ctx.yml
          git config user.name solelove
          git config user.email 19372340679@163.com
          git add -A
          git commit -m "feat(proactive): 时间放到上下文最前并附最近对话时间线 [skip ci]" || echo nothing
          git push
