name: Time Inject Per Message

"on":
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout v2.2.3
        uses: actions/checkout@v4
        with:
          ref: 7b041d773085f87ef6dfc1707c079c5ced96244d
          fetch-depth: 0

      - name: Checkout patch script
        run: |
          git fetch origin master --depth 1
          git show origin/master:scripts/patch_permsg_time.py > /tmp/patch_permsg_time.py

      - name: Verify base
        run: |
          echo "HEAD=$(git rev-parse HEAD)"
          git describe --tags --exact-match || true

      - name: Apply time patch
        run: |
          python3 /tmp/patch_permsg_time.py
          echo "----- diff -----"
          git --no-pager diff
          echo "----- check -----"
          grep -n "val timeReminder = TimeReminderTransformer.buildReminder(messages)" app/src/main/java/me/rerere/rikkahub/data/ai/GenerationHandler.kt

      - name: Init submodules
        run: git submodule update --init --depth 1 material3/material-color-utilities || true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: pnpm
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate
          if [ -f web-ui/pnpm-lock.yaml ]; then pnpm --dir web-ui install --frozen-lockfile
          elif [ -f web-ui/package.json ]; then pnpm --dir web-ui install
          else echo skip; fi

      - name: keystore
        run: |
          keytool -genkeypair -v -keystore app/release.keystore -storepass orangechat2026 -keypass orangechat2026 -alias orangechat -keyalg RSA -keysize 2048 -validity 36500 -dname "CN=OrangeChat,O=OrangeChat,C=CN"
          printf 'storeFile=release.keystore\nstorePassword=orangechat2026\nkeyAlias=orangechat\nkeyPassword=orangechat2026\n' > local.properties

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-permsg-v223-${{ hashFiles('**/*.gradle*') }}

      - name: Build
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleRelease 2>&1 | tee build.log

      - name: Verify APK
        run: |
          ls -lh app/build/outputs/apk/release/
          test -n "$(find app/build/outputs/apk/release -name '*.apk' -print -quit)" && echo "APK OK" || { echo "NO APK"; exit 1; }

      - name: Upload artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: orangechat-timefull
          path: app/build/outputs/apk/release/*.apk

      - name: Publish
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="223-timefull-$(date +%Y%m%d%H%M)"
          gh release create "$TAG" --title "基于 v2.2.3 时间上下文无条件注入" --notes "基于 v2.2.3 (7b041d77)。只改时间注入：去掉 enableTimeReminder 开关判断，每条消息无条件注入真实当前时间（年月日时分）。其余源码完全一致，头像与时间条未改动。" app/build/outputs/apk/release/*.apk
