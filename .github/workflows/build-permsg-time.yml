name: Time Inject Per Message

"on":
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 77f389dce52d53ddacce4f07ca885a2e3bcbf005
          fetch-depth: 0

      - name: Verify base
        run: echo "commit=$(git rev-parse HEAD)"

      - name: Fetch patch script
        run: |
          git fetch origin master --depth 1
          git show origin/master:scripts/patch_permsg_time.py > patch_permsg_time.py
          wc -l patch_permsg_time.py

      - name: Apply patch
        run: |
          python3 patch_permsg_time.py
          grep -n "time_reminder>Current time" app/src/main/java/me/rerere/rikkahub/data/ai/GenerationHandler.kt

      - name: Show diff
        run: git --no-pager diff

      - name: Init submodules
        run: git submodule update --init --depth 1 material3/material-color-utilities || true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: pnpm
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate
          if [ -f web-ui/pnpm-lock.yaml ]; then pnpm --dir web-ui install --frozen-lockfile
          elif [ -f web-ui/package.json ]; then pnpm --dir web-ui install
          else echo skip; fi

      - name: keystore
        run: |
          keytool -genkeypair -v -keystore app/release.keystore -storepass orangechat2026 -keypass orangechat2026 -alias orangechat -keyalg RSA -keysize 2048 -validity 36500 -dname "CN=OrangeChat,O=OrangeChat,C=CN"
          printf 'storeFile=release.keystore\nstorePassword=orangechat2026\nkeyAlias=orangechat\nkeyPassword=orangechat2026\n' > local.properties

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-permsg-${{ hashFiles('**/*.gradle*') }}

      - name: Build
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleRelease 2>&1 | tee build.log

      - name: Verify APK
        run: |
          ls -lh app/build/outputs/apk/release/ || true
          test -n "$(find app/build/outputs/apk/release -name '*.apk' -print -quit)" && echo "APK OK" || { echo "NO APK"; exit 1; }

      - name: Upload artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: orangechat-permsg-time
          path: app/build/outputs/apk/release/*.apk

      - name: Publish
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="permsg-time-$(date +%Y%m%d%H%M)"
          gh release create "$TAG" --title "每消息注入时间" --notes "基于 223-avatar-202611090805 (77f389dce)。只改时间注入：年月日时分，每条消息强制注入，界面不显示，时间条和头像不碰。" app/build/outputs/apk/release/*.apk
