name: Time Inject Per Message

"on":
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 77f389dce52d53ddacce4f07ca885a2e3bcbf005
          fetch-depth: 0

      - name: Verify base
        run: echo "commit=$(git rev-parse HEAD)"

      - name: Fetch patch script
        run: |
          git fetch origin master --depth 1
          git show origin/master:scripts/patch_permsg_time.py > patch_permsg_time.py
          wc -l patch_permsg_time.py

      - name: Apply patch
        run: |
          python3 patch_permsg_time.py
          grep -n "time_reminder>Current time" app/src/main/java/me/rerere/rikkahub/data/ai/GenerationHandler.kt

      - name: Show diff
        run: git --no-pager diff

      - name: Init submodules
        run: git submodule update --init --depth 1 material3/material-color-utilities || true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: keystore
        run: |
          keytool -genkeypair -v -keystore app/release.keystore -storepass orangechat2026 -keypass orangechat2026 -alias orangechat -keyalg RSA -keysize 2048 -validity 36500 -dname "CN=OrangeChat,O=OrangeChat,C=CN"
          printf 'storeFile=release.keystore\nstorePassword=orangechat2026\nkeyAlias=orangechat\nkeyPassword=orangechat2026\n' > local.properties

      - name: Build
        run: |
          chmod +x gradlew
          set +e
          ./gradlew assembleRelease > build.log 2>&1
          echo "EXIT=$?" > exit_code.txt
          set -e
          cat exit_code.txt
          tail -n 30 build.log || true

      - name: Push full log
        if: always()
        run: |
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git checkout master -- . 2>/dev/null || true
          cp build.log ci-build-full.log 2>/dev/null || echo "no build.log" > ci-build-full.log
          cp exit_code.txt ci-exit-code.txt 2>/dev/null || echo "none" > ci-exit-code.txt
          git add -f ci-build-full.log ci-exit-code.txt
          git commit -m "ci: full build log [skip ci]" || echo nothing-to-commit
          git push origin HEAD:master || echo push-failed
