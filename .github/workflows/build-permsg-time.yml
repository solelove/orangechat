name: Time Inject Per Message

"on":
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 77f389dc avatar base
        uses: actions/checkout@v4
        with:
          ref: 77f389dce52d53ddacce4f07ca885a2e3bcbf005
          fetch-depth: 0

      - name: Checkout patch script
        run: |
          git fetch origin master --depth 1
          git show origin/master:scripts/patch_permsg_time.py > /tmp/patch_permsg_time.py

      - name: Verify base
        run: |
          echo "HEAD=$(git rev-parse HEAD)"

      - name: Apply time patch
        run: |
          python3 /tmp/patch_permsg_time.py
          echo "----- diff (only time files should appear) -----"
          git --no-pager diff --stat
          git --no-pager diff
          echo "----- verify GenerationHandler -----"
          grep -n "val timeReminder = TimeReminderTransformer.buildReminder(messages)" app/src/main/java/me/rerere/rikkahub/data/ai/GenerationHandler.kt
          echo "----- verify TimeReminderTransformer -----"
          if grep -n "if (gapSeconds <= TIME_GAP_THRESHOLD_SECONDS) return null" app/src/main/java/me/rerere/rikkahub/data/ai/transformers/TimeReminderTransformer.kt; then
            echo "STILL HAS GAP GUARD"; exit 1
          fi
          echo "gap guard removed OK"

      - name: Init submodules
        run: git submodule update --init --depth 1 material3/material-color-utilities || true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: pnpm
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate
          if [ -f web-ui/pnpm-lock.yaml ]; then pnpm --dir web-ui install --frozen-lockfile
          elif [ -f web-ui/package.json ]; then pnpm --dir web-ui install
          else echo skip; fi

      - name: keystore
        run: |
          keytool -genkeypair -v -keystore app/release.keystore -storepass orangechat2026 -keypass orangechat2026 -alias orangechat -keyalg RSA -keysize 2048 -validity 36500 -dname "CN=OrangeChat,O=OrangeChat,C=CN"
          printf 'storeFile=release.keystore\nstorePassword=orangechat2026\nkeyAlias=orangechat\nkeyPassword=orangechat2026\n' > local.properties

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-permsg-avatar-${{ hashFiles('**/*.gradle*') }}

      - name: Build
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleRelease 2>&1 | tee build.log

      - name: Verify APK
        run: |
          ls -lh app/build/outputs/apk/release/
          test -n "$(find app/build/outputs/apk/release -name '*.apk' -print -quit)" && echo "APK OK" || { echo "NO APK"; exit 1; }

      - name: Upload artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: orangechat-timefull-avatar
          path: app/build/outputs/apk/release/*.apk

      - name: Publish
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          TAG="avatar-timefull-$(date +%Y%m%d%H%M)"
          gh release create "$TAG" --repo "$REPO" --title "在每气泡带头像版上只加时间注入" --notes "基于 77f389dc（223-avatar-202611090805 那版的提交）。只改时间注入：去掉 enableTimeReminder 开关判断和 1 小时间隔判断。头像 键盘 消息框 气泡框 全部未动。" app/build/outputs/apk/release/*.apk
