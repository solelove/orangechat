name: Time Inject Per Message

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 77f389dce52d53ddacce4f07ca885a2e3bcbf005
          fetch-depth: 0

      - name: Verify base
        run: |
          echo "commit=$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "77f389dce52d53ddacce4f07ca885a2e3bcbf005" && echo "base OK" || { echo "base MISMATCH"; exit 1; }

      - name: Apply time injection patch
        run: |
          cat > /tmp/p.b64 <<'B64EOF'
 TkUiKQo=
B64EOF
          tr -d ' \n' < /tmp/p.b64 | base64 -d > /tmp/p.py
          python3 /tmp/p.py

      - name: Show diff
        run: git --no-pager diff --stat

      - name: Init submodules
        run: git submodule update --init --depth 1 material3/material-color-utilities || true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: keystore
        run: |
          keytool -genkeypair -v \
            -keystore app/release.keystore \
            -storepass orangechat2026 -keypass orangechat2026 \
            -alias orangechat -keyalg RSA -keysize 2048 -validity 36500 \
            -dname "CN=OrangeChat,O=OrangeChat,C=CN"
          cat > local.properties <<'EOF'
          storeFile=release.keystore
          storePassword=orangechat2026
          keyAlias=orangechat
          keyPassword=orangechat2026
          EOF

      - name: Build
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleRelease 2>&1 | tee build.log

      - name: Dump error
        if: failure()
        run: |
          {
            echo "=== kotlin errors ==="
            grep -E "^e: " build.log | head -60 || true
            echo "=== tail ==="
            tail -n 60 build.log || true
          } > ci-timeerr.log
          cat ci-timeerr.log

      - name: Upload artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: orangechat-permsg-time
          path: app/build/outputs/apk/release/*.apk

      - name: Publish
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="permsg-time-$(date +%Y%m%d%H%M)"
          gh release create "$TAG" \
            --title "每消息注入时间 (基于 223-avatar-202611090805)" \
            --notes "基于 223-avatar-202611090805 提交 77f389dce，只改时间注入：年月日时分，每条消息强制注入，界面不显示，时间条不动" \
            app/build/outputs/apk/release/*.apk
