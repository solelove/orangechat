name: Time Inject Per Message

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 77f389dce52d53ddacce4f07ca885a2e3bcbf005
          fetch-depth: 0

      - name: Verify base
        run: |
          echo "commit=$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "77f389dce52d53ddacce4f07ca885a2e3bcbf005" && echo "base OK" || { echo "base MISMATCH"; exit 1; }

      - name: Apply time injection patch
        run: |
          cat > /tmp/patch.py <<'PYEOF'
import io, sys

P = "app/src/main/java/me/rerere/rikkahub/data/ai/GenerationHandler.kt"
s = io.open(P, encoding="utf-8").read()

OLD = (
    "            val timeReminder = TimeReminderTransformer.buildReminder(messages)\n"
    "            val systemWithTime = if (timeReminder != null) {\n"
    "                system + \"\\n\\n\" + timeReminder\n"
    "            } else system\n"
    "            if (systemWithTime.isNotBlank()) add(UIMessage.system(prompt = systemWithTime))\n"
    "            addAll(messages.limitContext(assistant.contextMessageSize))"
)

NEW = (
    "            val timeReminder = TimeReminderTransformer.buildReminder(messages)\n"
    "            val systemWithTime = if (timeReminder != null) {\n"
    "                system + \"\\n\\n\" + timeReminder\n"
    "            } else system\n"
    "            if (systemWithTime.isNotBlank()) add(UIMessage.system(prompt = systemWithTime))\n"
    "            addAll(\n"
    "                messages.limitContext(assistant.contextMessageSize).map { msg ->\n"
    "                    val stamp = \"<time_reminder>Current time: \" + String.format(\n"
    "                        java.util.Locale.US,\n"
    "                        \"%04d-%02d-%02d %02d:%02d\",\n"
    "                        msg.createdAt.year,\n"
    "                        msg.createdAt.monthNumber,\n"
    "                        msg.createdAt.dayOfMonth,\n"
    "                        msg.createdAt.hour,\n"
    "                        msg.createdAt.minute,\n"
    "                    ) + \"</time_reminder>\\n\"\n"
    "                    msg.copy(parts = listOf(UIMessagePart.Text(stamp)) + msg.parts)\n"
    "                }\n"
    "            )"
)

if "msg.copy(parts = listOf(UIMessagePart.Text(stamp)) + msg.parts)" in s:
    print("ALREADY PATCHED")
    sys.exit(0)

if OLD not in s:
    print("ANCHOR MISSING")
    sys.exit(1)

s = s.replace(OLD, NEW, 1)
io.open(P, "w", encoding="utf-8", newline="").write(s)
print("PATCHED OK")
PYEOF
          python3 /tmp/patch.py
          echo "=== verify ==="
          grep -n "time_reminder>Current time" app/src/main/java/me/rerere/rikkahub/data/ai/GenerationHandler.kt

      - name: Show diff
        run: |
          git --no-pager diff --stat
          git --no-pager diff

      - name: Init submodules
        run: git submodule update --init --depth 1 material3/material-color-utilities || true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: pnpm
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate
          if [ -f web-ui/pnpm-lock.yaml ]; then pnpm --dir web-ui install --frozen-lockfile
          elif [ -f web-ui/package.json ]; then pnpm --dir web-ui install
          else echo skip; fi

      - name: keystore
        run: |
          keytool -genkeypair -v \
            -keystore app/release.keystore \
            -storepass orangechat2026 -keypass orangechat2026 \
            -alias orangechat -keyalg RSA -keysize 2048 -validity 36500 \
            -dname "CN=OrangeChat,O=OrangeChat,C=CN"
          cat > local.properties <<'EOF'
          storeFile=release.keystore
          storePassword=orangechat2026
          keyAlias=orangechat
          keyPassword=orangechat2026
          EOF

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-permsg-${{ hashFiles('**/*.gradle*') }}

      - name: Build
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleRelease 2>&1 | tee build.log

      - name: Dump error to repo
        if: failure()
        run: |
          {
            echo "=== kotlin errors ==="
            grep -E "^e: " build.log | head -60 || true
            echo "=== what went wrong ==="
            sed -n '/What went wrong/,/BUILD FAILED/p' build.log | head -60 || true
            echo "=== tail ==="
            tail -n 40 build.log || true
          } > ci-timeerr.log
          cat ci-timeerr.log
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add -f ci-timeerr.log
          git commit -m "ci: timeerr [skip ci]" || true
          git push origin HEAD:master || true

      - name: Upload artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: orangechat-permsg-time
          path: app/build/outputs/apk/release/*.apk

      - name: Publish
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="permsg-time-$(date +%Y%m%d%H%M)"
          gh release create "$TAG" \
            --title "每消息注入时间" \
            --notes "基于 223-avatar-202611090805 (77f389dce)。只改时间注入：年月日时分，每条消息强制注入，界面不显示，时间条和头像不碰。" \
            app/build/outputs/apk/release/*.apk
